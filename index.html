<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solveur de Calculs - Étape par Étape</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
        }
        h1 {
            color: #38bdf8;
            margin-top: 0;
            font-size: 1.8rem;
            text-align: center;
        }
        .option-box {
            background-color: #0f172a;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #334155;
        }
        .option-box label {
            font-size: 0.95rem;
            color: #38bdf8;
            font-weight: bold;
            cursor: pointer;
        }
        .option-box input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #0284c7;
            cursor: pointer;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 15px;
            border: 2px solid #334155;
            border-radius: 8px;
            background-color: #0f172a;
            color: #fff;
            font-size: 1.1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: #38bdf8;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0369a1;
        }
        .result-box {
            margin-top: 25px;
            padding: 15px;
            background-color: #0f172a;
            border-radius: 8px;
            border-left: 4px solid #38bdf8;
        }
        .result-title {
            font-size: 0.85rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        .step {
            font-size: 1.2rem;
            margin: 6px 0;
            color: #e2e8f0;
            font-family: 'Courier New', Courier, monospace;
        }
        .final-result {
            color: #4ade80;
            font-weight: bold;
        }
        .error {
            color: #f87171 !important;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Solveur de Mathématiques</h1>

    <!-- Option en haut pour activer/désactiver le détail des étapes -->
    <div class="option-box">
        <label for="showSteps">Afficher le calcul étape par étape</label>
        <input type="checkbox" id="showSteps" checked onchange="resoudre()">
    </div>

    <input type="text" id="expression" placeholder="Ex: 150 - (28 - (17 - 13))" value="150 - (28 - (17 - 13))">
    <button onclick="resoudre()">Calculer</button>

    <div class="result-box">
        <div class="result-title">Résolution</div>
        <div id="resultat"></div>
    </div>
</div>

<script>
    function resoudre() {
        let input = document.getElementById('expression').value;
        let resDiv = document.getElementById('resultat');
        let showSteps = document.getElementById('showSteps').checked;

        if (!input.trim()) {
            resDiv.innerHTML = '<span class="error">Veuillez entrer un calcul</span>';
            return;
        }

        // Nettoyage de l'expression (remplacement des symboles usuels)
        let expr = input
            .replace(/x/gi, '*')
            .replace(/:/g, '/')
            .replace(/\[/g, '(')             .replace(/\]/g, ')');

        try {
            if (!showSteps) {
                // Affichage direct sans les étapes
                let res = Function('"use strict"; return (' + expr + ')')();
                resDiv.innerHTML = `<div class="step final-result">= ${res}</div>`;
                return;
            }

            // Calcul étape par étape en résolvant d'abord les parenthèses les plus internes
            let steps = [input];
            let currentExpr = expr;
            let maxSafety = 20; // Évite les boucles infinies

            while (maxSafety > 0) {
                // 1. Chercher les parenthèses les plus profondes (sans sous-parenthèses)
                let innerParen = /\(([^()]+)\)/.exec(currentExpr);
                
                if (innerParen) {
                    let subExpr = innerParen[1];
                    let subRes = Function('"use strict"; return (' + subExpr + ')')();
                    currentExpr = currentExpr.replace(innerParen[0], subRes);
                    
                    // Formater l'expression lisible pour l'affichage
                    let displayExpr = currentExpr.replace(/\*/g, ' x ').replace(/\//g, ' : ');
                    if (!steps.includes(displayExpr)) {
                        steps.push(displayExpr);
                    }
                } else {
                    // S'il n'y a plus de parenthèses, résoudre la totalité
                    let finalRes = Function('"use strict"; return (' + currentExpr + ')')();
                    let displayFinal = "= " + finalRes;
                    if (steps[steps.length - 1] !== displayFinal) {
                        steps.push(displayFinal);
                    }
                    break;
                }
                maxSafety--;
            }

            // Générer l'affichage HTML des étapes
            let html = '';
            steps.forEach((step, index) => {
                let isLast = index === steps.length - 1;
                let prefix = index === 0 ? '' : '= ';
                html += `<div class="step ${isLast ? 'final-result' : ''}">${prefix}${step}</div>`;
            });

            resDiv.innerHTML = html;

        } catch (e) {
            resDiv.innerHTML = '<span class="error">Erreur dans la formule (vérifiez les parenthèses)</span>';
        }
    }

    // Calcul automatique au chargement
    resoudre();
</script>

</body>
</html>
