<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solveur de Calculs</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 480px;
            text-align: center;
        }
        h1 {
            color: #38bdf8;
            margin-top: 0;
            font-size: 1.8rem;
        }
        p {
            color: #94a3b8;
            font-size: 0.95rem;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            margin: 20px 0;
            border: 2px solid #334155;
            border-radius: 8px;
            background-color: #0f172a;
            color: #fff;
            font-size: 1.1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #38bdf8;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0369a1;
        }
        .result-box {
            margin-top: 25px;
            padding: 15px;
            background-color: #0f172a;
            border-radius: 8px;
            border-left: 4px solid #38bdf8;
            text-align: left;
            min-height: 60px;
        }
        .result-title {
            font-size: 0.85rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        .result-value {
            font-size: 1.4rem;
            font-weight: bold;
            color: #4ade80;
            word-break: break-all;
        }
        .error {
            color: #f87171 !important;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Solveur de Calculs</h1>
    <p>Entre un calcul complexe (avec des parenthèses, <code>x</code> ou <code>*</code>, <code>:</code> ou <code>/</code>)</p>
    
    <input type="text" id="expression" placeholder="Ex: (18 - 4) x (9 - 3)" value="(18 - 4) x (9 - 3)">
    <button onclick="resoudre()">Calculer</button>

    <div class="result-box">
        <div class="result-title">Résultat</div>
        <div id="resultat" class="result-value">Saisissez un calcul</div>
    </div>
</div>

<script>
    function resoudre() {
        let input = document.getElementById('expression').value;
        let resDiv = document.getElementById('resultat');

        if (!input.trim()) {
            resDiv.textContent = "Veuillez entrer un calcul";
            resDiv.classList.add('error');
            return;
        }

        try {
            // Nettoyage de l'expression pour le JS :
            // remplace 'x' ou 'X' par '*', ':' par '/', '[' par '(', ']' par ')'
            let exprClean = input
                .replace(/x/gi, '*')
                .replace(/:/g, '/')
                .replace(/\[/g, '(')
                .replace(/\]/g, ')');

            // Évaluation sécurisée des expressions mathématiques de base
            let resultat = Function('"use strict"; return (' + exprClean + ')')();

            if (isNaN(resultat) || !isFinite(resultat)) {
                resDiv.textContent = "Calcul impossible";
                resDiv.classList.add('error');
            } else {
                resDiv.textContent = "= " + resultat;
                resDiv.classList.remove('error');
            }
        } catch (e) {
            resDiv.textContent = "Erreur dans la formule";
            resDiv.classList.add('error');
        }
    }

    // Calcul automatique au chargement
    resoudre();
</script>

</body>
</html>
